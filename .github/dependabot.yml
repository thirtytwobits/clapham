version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        update-types:
          - minor
          - patch
        # docs/mcp.md cites source paths in the pinned rmcp release, so an rmcp update is reviewed alone.
        exclude-patterns:
          - rmcp
