name: API documentation

# Publication deploys the API reference archives attached to the published releases; it builds
# nothing. The push to main builds each release's archive.
on:
  pull_request:
    paths: ['.github/workflows/api-docs.yml', '.github/scripts/build_api_docs.py']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: api-docs-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      # v7.0.1; action.yml declares runs.using: node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.0.0; action.yml declares runs.using: node24.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: github.event_name != 'pull_request'
      - name: Assemble the published API references
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_api_docs.py site "$RUNNER_TEMP/api-site"
      # v5.0.0; composite action pins upload-artifact v7.0.0, which declares node24.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/api-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5.0.1; action.yml declares runs.using: node24.
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
