name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # v7.0.1; action.yml declares runs.using: node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install gate toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask check
      - run: cargo xtask boundaries

  core-msrv:
    name: Core MSRV
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked -p clapham -p clapham-cli
      - run: cargo +1.88.0 test --locked -p clapham -p clapham-cli
      - run: cargo +1.88.0 test --locked -p clapham --features serde_json/preserve_order revision_

  mcp-msrv:
    name: MCP MSRV
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked -p clapham-mcp-server -p clapham-mcp-client -p clapham-conformance -p clapham-lists -p clapham-typed --all-features
      - run: cargo +1.88.0 check --locked -p clapham-mcp-server -p clapham-mcp-client --no-default-features
      - run: cargo +1.88.0 check --locked -p clapham-mcp-server -p clapham-mcp-client --no-default-features --features stdio
      - run: cargo +1.88.0 check --locked -p clapham-mcp-server -p clapham-mcp-client --no-default-features --features http

  api:
    name: API (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup toolchain install nightly-2025-08-02 --profile minimal
      - run: cargo +1.99.0 install cargo-public-api --version 0.50.2 --locked
      - run: cargo xtask api
