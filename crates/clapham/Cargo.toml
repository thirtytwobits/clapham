[package]
name = "clapham"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
description = "The contract for operations, descriptors, refusals, OAuth authority, composition, selection, gates and calls."
readme = "README.md"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
jsonschema = { version = "0.60.0", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
futures-channel = "0.3"
futures-executor = "0.3"

[lints]
workspace = true
