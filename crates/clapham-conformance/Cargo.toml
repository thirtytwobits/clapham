[package]
name = "clapham-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
description = "The lists-and-items contribution and front-end conformance harness."
readme = "README.md"

[[bin]]
name = "clapham-cli-fixture"
path = "tests/support/cli_fixture.rs"
test = false
doc = false

[[bin]]
name = "clapham-mcp-fixture"
path = "tests/support/mcp_fixture.rs"
test = false
doc = false

[[bin]]
name = "clapham-harness-fixture"
path = "tests/support/harness_fixture.rs"
test = false
doc = false

[dependencies]
clapham.workspace = true
clapham-cli.workspace = true
clapham-mcp-server.workspace = true
clapham-mcp-client.workspace = true
futures-channel = "0.3"
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "io-util", "process"] }

[dev-dependencies]
axum = "0.8.6"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
jsonschema = { version = "0.60.0", default-features = false }

[lints]
workspace = true
