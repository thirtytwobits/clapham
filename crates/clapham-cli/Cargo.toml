[package]
name = "clapham-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
description = "The command-line front end for composed operations."
readme = "README.md"

[dependencies]
uuid = { version="1", default-features=false, features=["std","serde"] }
serde = { version="1", features=["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt"] }
clapham.workspace = true
clap = { version = "4.6.7", default-features = false, features = ["std", "string", "help", "usage", "error-context"] }
clap_complete = { version = "4.6.5", default-features = false }
futures-timer = "3.0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
humantime = "2.4.0"
schemars = "1.2.3"
serde_json = "1.0"

[dev-dependencies]
futures-executor = "0.3"

[lints]
workspace = true
