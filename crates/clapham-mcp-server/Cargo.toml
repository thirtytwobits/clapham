[package]
name = "clapham-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
description = "The MCP server front end for composed operations."
readme = "README.md"

[dependencies]
clapham.workspace = true
rmcp = { version = "=3.6.0", default-features = false, features = ["server"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
percent-encoding = "2.3"
tokio = { version = "1", features = ["sync", "macros"] }

[features]
default = ["stdio", "http"]
stdio = ["rmcp/transport-io"]
http = []

[lints]
workspace = true
