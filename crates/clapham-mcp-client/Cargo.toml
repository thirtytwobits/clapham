[package]
name = "clapham-mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
description = "The MCP client that binds remote tools as operations."
readme = "README.md"

[dependencies]
clapham.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["client"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
sha2 = "0.10"
jsonschema = { version = "0.60.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
sse-stream = { version = "0.2.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
axum = "0.8.6"
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw"] }

[features]
default = ["stdio", "http"]
stdio = ["tokio/io-util"]
http = ["dep:reqwest", "dep:http", "dep:bytes", "dep:sse-stream", "rmcp/transport-streamable-http-client"]

[lints]
workspace = true
